[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ropc"
version = "1.0.0"
description = "Role-conditioned Operator Predictive Control for deep graph neural networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
datasets = [
  "torch-geometric>=2.7,<3",
  "ogb==1.3.6",
  "huggingface-hub>=0.30,<2",
  "scikit-learn>=1.4,<2",
  "pandas>=2.1,<4",
  "outdated>=0.2.2",
  "xxhash>=3",
]
dev = ["pytest>=8,<10", "build>=1.2"]

[project.scripts]
ropc = "ropc.cli:main"

[tool.setuptools.packages.find]
include = ["ropc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

